services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coloring
      POSTGRES_USER: coloring
      POSTGRES_PASSWORD: coloring
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coloring"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://coloring:coloring@db:5432/coloring
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file: .env
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped

volumes:
  db_data:
